name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified preview assets for VERSION
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: node tools/privacy-scan.js .
      - name: C++ regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/anisette_validation.cpp -o /tmp/test-anisette
          /tmp/test-anisette
          g++ -std=c++17 -Wall -Wextra -Itests/stubs tests/wired_connection.cpp -o /tmp/test-wired
          /tmp/test-wired
      - name: Shell syntax
        run: |
          sh -n install.sh
          for script in scripts/*.sh; do sh -n "$script"; done
          for script in scripts/runtime/*; do
            if head -n 1 "$script" | grep -q '/sh'; then sh -n "$script"; fi
          done
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build fork from source
        run: |
          docker build -f docker/Dockerfile.build --target export --output type=local,dest=dist .
          chmod +x dist/AltServer-x86_64
      - name: CLI regression tests
        run: python3 tools/check-cli.py dist/AltServer-x86_64
      - name: Create install bundle
        run: sh scripts/package.sh
      - name: Extracted installer on Debian 13
        run: |
          docker run --rm -v "$PWD:/source:ro" -v /var/run/docker.sock:/var/run/docker.sock \
            debian:13-slim sh /source/tests/install-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: altserver-linux-amd64
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [runtime, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: altserver-linux-amd64
          path: dist
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$version" dist/AltServer-x86_64 dist/AltServer-Linux-amd64-setup.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "$version — Preview / プレビュー" \
            --notes-file "docs/release-$version.md"
